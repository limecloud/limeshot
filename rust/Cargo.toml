[workspace]
members = [
  "crates/business-protocol",
  "crates/artifacts",
  "crates/skills",
  "crates/providers",
  "crates/media",
  "crates/projects",
  "crates/resources",
  "crates/tools",
  "crates/business-core",
  "crates/business-server",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Lime Cloud"]

[workspace.dependencies]
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
